# COPY BEGIN 3f403a5d [NEEDS HUMAN REVIEW]
title: Outpost
description: Group messaging for iPhone with no Outpost server. How it works, what is built, and what has been proved.
# COPY END 3f403a5d

theme: just-the-docs

url: https://grifftatarsky.github.io
baseurl: /outpost

# SEARCH ###############################################################
search_enabled: true
search:
  heading_level: 2
  previews: 3
  rel_url: true

# NAV / CHROME #########################################################
heading_anchors: true
# COPY BEGIN 4325d3a9 [NEEDS HUMAN REVIEW]
aux_links:
  "Source on GitHub": "https://github.com/grifftatarsky/outpost"
  "outpostmessaging.com": "https://outpostmessaging.com"
# COPY END 4325d3a9
aux_links_new_tab: true

# COPY BEGIN 6ca5e421 [NEEDS HUMAN REVIEW]
footer_content: "Licensed under the Mozilla Public License 2.0." 
# COPY END 6ca5e421

# CALLOUTS #############################################################
# `unbuilt` is red on purpose. The copy guide's first rule is that present
# tense means it is in the build; this is the visual form of that rule, so a
# page cannot quietly describe something that does not exist.
# COPY BEGIN 9dcc1202 [NEEDS HUMAN REVIEW]
callouts:
  important:
    title: Important
    color: yellow
  unbuilt:
    title: Not built
    color: red
  unproven:
    title: Built, unproven
    color: purple
  inbox:
    color: blue
# COPY END 9dcc1202

# BUILD ################################################################
plugins:
  - jekyll-relative-links

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  # A legal text served verbatim, not a documentation page.
  - TESTFLIGHT_LICENCE.txt

# The theme (just-the-docs 0.12) still uses `@import`, `map-get`, `darken()` and `lighten()`, all
# of which Dart Sass 1.8x+ warns about on every build — a hundred and eighty lines of somebody
# else's deprecations in front of every "done in". They are the theme's to fix, not ours; nothing
# under docs/ is Sass. `quiet_deps` covers the theme's partials, and the three categories cover
# the theme's root stylesheets, which count as ours because Jekyll compiles them from here.
sass:
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions
